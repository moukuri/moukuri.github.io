<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Moukuri Mohim | Architect</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0e0e0e;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  .box {
    text-align: center;
    animation: float 3s ease-in-out infinite;
  }

  h1 {
    font-size: 2.5rem;
    letter-spacing: 2px;
    margin: 0;
  }

  p {
    margin: 8px 0 20px;
    opacity: 0.7;
    letter-spacing: 1px;
  }

  .loader {
    width: 120px;
    height: 4px;
    background: #222;
    overflow: hidden;
    margin: auto;
  }

  .loader::before {
    content: "";
    display: block;
    width: 40px;
    height: 100%;
    background: #ffffff;
    animation: load 1.2s linear infinite;
  }

  @keyframes load {
    0% { transform: translateX(-40px); }
    100% { transform: translateX(160px); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
</style>
</head>

<body>
  <div class="box">
    <h1>Moukuri Mohim</h1>
    <p>Architect</p>
    <p>Website Under Construction</p>
    <div class="loader"></div>
  </div>
</body>
</html>
